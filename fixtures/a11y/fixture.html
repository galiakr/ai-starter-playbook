<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>a11y fixture</title>
</head>
<body>
  <h1>Accessibility fixture</h1>

  <!-- PLANTED ISSUE 1: missing alt attribute -->
  <img src="logo.png" width="120" height="40" />

  <!-- NOT planted: correctly tagged, should not be flagged -->
  <img src="banner.png" alt="Company banner" width="600" height="200" />

  <form>
    <!-- PLANTED ISSUE 2: input with no label or aria-label -->
    <input type="text" name="email" placeholder="Email" />

    <!-- NOT planted: correctly labeled, should not be flagged -->
    <label for="name">Name</label>
    <input type="text" id="name" name="name" />

    <button type="submit">Submit</button>
  </form>

  <!-- PLANTED ISSUE 3: low-contrast text, light gray on white -->
  <p style="color: #cccccc; background: #ffffff;">
    This text fails WCAG AA contrast requirements.
  </p>

  <!-- NOT planted: adequate contrast, should not be flagged -->
  <p style="color: #222222; background: #ffffff;">
    This text passes contrast requirements.
  </p>
</body>
</html>
